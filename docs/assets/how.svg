<text x="360" y="238" font-size="14" font-weight="700" fill="#E6B873" text-anchor="middle">화면 · 입력은 직접</text>
<text x="360" y="284" font-size="12.5" fill="#93A2AA" text-anchor="middle">P2P · 암호화 · 중계 서버 없음</text>
