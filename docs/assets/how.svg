<path d="M420 102 L548 172" stroke="#93A2AA" stroke-width="2" stroke-dasharray="6 6" fill="none"/>
<text x="196" y="140" font-size="12.5" fill="#93A2AA" text-anchor="middle">연결할 때만</text>
<text x="528" y="128" font-size="12.5" fill="#93A2AA" text-anchor="middle">연결할 때만</text>
<rect x="56" y="194" width="196" height="122" rx="10" fill="#6E4428"/>
<rect x="68" y="205" width="172" height="96" rx="4" fill="#4B3A2A"/>
<text x="154" y="248" font-size="16" font-weight="700" fill="#EFE6D3" text-anchor="middle">PC 호스트</text>
<text x="154" y="272" font-size="12.5" fill="#93A2AA" text-anchor="middle">Windows · 리눅스</text>
<rect x="139" y="316" width="30" height="14" fill="#6E4428"/>
