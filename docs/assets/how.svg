<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-labelledby="ht hd">
<title id="ht">Remote의 연결 구조</title>
<desc id="hd">PC 호스트와 폰·태블릿(또는 다른 PC)은 화면과 입력을 직접(P2P, 암호화) 주고받습니다. 연결을 시작할 때의 짧은 신호와 기기 목록만 내가 만든 Firebase 프로젝트를 거칩니다. 개발자 서버와 중계 서버는 없습니다.</desc>
<style>text{font-family:system-ui,-apple-system,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif}</style>
<rect width="720" height="380" rx="24" fill="#2B2015"/>
<rect x="250" y="28" width="220" height="74" rx="14" fill="#4B3A2A" stroke="#93A2AA" stroke-width="1.5"/>
<text x="360" y="60" font-size="17" font-weight="700" fill="#EFE6D3" text-anchor="middle">내 Firebase 프로젝트</text>
<text x="360" y="84" font-size="12.5" fill="#93A2AA" text-anchor="middle">로그인 · 기기 목록 · 연결 신호</text>
